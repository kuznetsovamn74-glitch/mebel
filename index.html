<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подбор мебели</title>
    
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <!-- React и ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .app-container {
            min-height: 100vh;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 0;
        }
        
        .quiz-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .quiz-subtitle {
            font-size: 15px;
            color: #666;
            line-height: 1.4;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .options-grid.two-col {
            grid-template-columns: 1fr 1fr;
        }
        
        .option-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        
        .option-card:active {
            transform: scale(0.97);
        }
        
        .option-card.selected {
            border-color: #4CD964;
            background: #f0fff4;
        }
        
        .option-image {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #f0f0f0;
        }
        
        .option-content {
            flex: 1;
        }
        
        .option-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1a1a1a;
        }
        
        .option-description {
            font-size: 13px;
            color: #666;
            line-height: 1.3;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 16px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #4CD964;
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        
        .progress-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }
        
        .button {
            width: 100%;
            padding: 16px;
            background: #4CD964;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .button-secondary {
            background: #666;
        }
        
        .button-back {
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
        }
        
        .slider-container {
            padding: 10px 0;
        }
        
        .slider {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: #4CD964;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .price-display {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 12px;
            margin: 16px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .price-value {
            font-size: 32px;
            font-weight: 700;
            color: #4CD964;
            line-height: 1.3;
        }
        
        .input-field {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.25s ease;
            background: white;
        }
        
        .input-field:focus {
            border-color: #4CD964;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4CD964;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .buttons-row {
            display: flex;
            gap: 10px;
        }
        
        .buttons-row .button {
            flex: 1;
        }
        
        .phone-button {
            width: auto;
            padding: 14px 16px;
            background: #666;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }
        
        .phone-button:active {
            transform: scale(0.95);
        }
        
        .phone-button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            text-align: center;
        }
        
        @media (max-width: 400px) {
            .options-grid.two-col {
                grid-template-columns: 1fr;
            }
            .quiz-title {
                font-size: 22px;
            }
            .option-image {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        console.log('Скрипт запущен');
        console.log('React:', typeof React);
        console.log('ReactDOM:', typeof ReactDOM);
        
        // Проверяем загрузку React
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            document.getElementById('root').innerHTML = 
                '<div style="text-align:center;padding:40px;font-family:Arial;">' +
                '<h2>Ошибка загрузки React</h2>' +
                '<p>Проверьте интернет-соединение</p>' +
                '</div>';
            throw new Error('React не загружен');
        }
        
        const { useState, useEffect } = React;
        
        // ==================== НАСТРОЙКИ ОТПРАВКИ ЗАЯВОК ====================
        // Замените на URL вашего Google Apps Script
        const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxFn5lTy9aN1B6DNRg9eXG-DCQwkOibwgA9kAAnNvkXa9-BfORuX6wvp_l8d4aVqkJu/exec';
        
        // ==================== ФОТОГРАФИИ ====================
        const IMAGES = {
            // Кухни
            kitchen: {
                modern: 'https://images.unsplash.com/photo-1556912167-f556f1f39fdf?w=400&h=400&fit=crop',
                classic: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&h=400&fit=crop',
                loft: 'https://images.unsplash.com/photo-1556909212-d5b604d0c90d?w=400&h=400&fit=crop',
                minimal: 'https://images.unsplash.com/photo-1600585152220-90363fe7e115?w=400&h=400&fit=crop',
            },
            // Шкафы
            wardrobe: {
                builtin: 'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=400&h=400&fit=crop',
                standalone: 'https://images.unsplash.com/photo-1595428774204-7cf6e0b91b57?w=400&h=400&fit=crop',
                sliding: 'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=400&h=400&fit=crop',
                hinged: 'https://images.unsplash.com/photo-1595428774204-7cf6e0b91b57?w=400&h=400&fit=crop',
            }
        };
        
        // ==================== КОМПОНЕНТ ПРОГРЕСС-БАРА ====================
        function ProgressBar({ currentStep, totalSteps }) {
            const percentage = (currentStep / totalSteps) * 100;
            
            return React.createElement('div', null,
                React.createElement('div', { className: 'progress-bar' },
                    React.createElement('div', { 
                        className: 'progress-fill', 
                        style: { width: percentage + '%' } 
                    })
                ),
                React.createElement('div', { className: 'progress-text' },
                    'Шаг ' + currentStep + ' из ' + totalSteps
                )
            );
        }
        
        // ==================== КОМПОНЕНТ КАРТОЧКИ С ФОТО ====================
        function OptionCard({ image, title, description, selected, onClick, column }) {
            const cardStyle = column ? 
                { flexDirection: 'column', textAlign: 'center', padding: '16px' } : 
                {};
            
            const imageStyle = column ? 
                { width: '100%', height: '150px', marginBottom: '12px' } : 
                {};
            
            return React.createElement('div', {
                className: 'option-card' + (selected ? ' selected' : ''),
                onClick: onClick,
                style: cardStyle
            },
                React.createElement('div', { 
                    className: 'option-image',
                    style: { ...imageStyle, backgroundImage: 'url("' + image + '")' }
                }),
                React.createElement('div', { 
                    className: 'option-content',
                    style: column ? { textAlign: 'center' } : {}
                },
                    React.createElement('div', { className: 'option-title' }, title),
                    React.createElement('div', { className: 'option-description' }, description)
                )
            );
        }
        
        // ==================== ГЛАВНЫЙ КОМПОНЕНТ ====================
        function App() {
            const [step, setStep] = useState('type');
            const [furnitureType, setFurnitureType] = useState(null);
            const [quizData, setQuizData] = useState({
                style: null,
                material: null,
                length: 3,
                wardrobeType: null,
                doorType: null,
                width: 2,
                priceMin: null,
                priceMax: null,
            });
            
            useEffect(() => {
                console.log('Приложение запущено');
                
                if (typeof vkBridge !== 'undefined') {
                    vkBridge.send('VKWebAppInit');
                    console.log('VK Bridge инициализирован');
                }
            }, []);
            
            const goNext = () => {
                const nextMap = {
                    'type': () => furnitureType === 'kitchen' ? 'kitchen_style' : 'wardrobe_type',
                    'kitchen_style': 'kitchen_material',
                    'kitchen_material': 'kitchen_size',
                    'kitchen_size': 'result',
                    'wardrobe_type': 'wardrobe_door',
                    'wardrobe_door': 'wardrobe_width',
                    'wardrobe_width': 'result',
                };
                
                const next = nextMap[step];
                if (typeof next === 'function') {
                    setStep(next());
                } else if (next) {
                    setStep(next);
                }
            };
            
            const goBack = () => {
                const backMap = {
                    'kitchen_style': 'type',
                    'kitchen_material': 'kitchen_style',
                    'kitchen_size': 'kitchen_material',
                    'wardrobe_type': 'type',
                    'wardrobe_door': 'wardrobe_type',
                    'wardrobe_width': 'wardrobe_door',
                    'result': furnitureType === 'kitchen' ? 'kitchen_size' : 'wardrobe_width',
                };
                setStep(backMap[step] || 'type');
            };
            
            // ==================== ЭКРАН ВЫБОРА ТИПА ====================
            if (step === 'type') {
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Подбор мебели'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Что хотели бы рассчитать?')
                    ),
                    
                    React.createElement('div', { className: 'options-grid two-col' },
                        React.createElement(OptionCard, {
                            image: IMAGES.kitchen.modern,
                            title: 'Кухню',
                            description: 'Рассчитаем стоимость',
                            selected: furnitureType === 'kitchen',
                            onClick: () => setFurnitureType('kitchen'),
                            column: true
                        }),
                        React.createElement(OptionCard, {
                            image: IMAGES.wardrobe.sliding,
                            title: 'Шкаф',
                            description: 'Подберем идеальный',
                            selected: furnitureType === 'wardrobe',
                            onClick: () => setFurnitureType('wardrobe'),
                            column: true
                        })
                    ),
                    
                    React.createElement('button', {
                        className: 'button',
                        disabled: !furnitureType,
                        onClick: goNext
                    }, 'Продолжить')
                );
            }
            
            // ==================== ЭКРАН СТИЛЯ КУХНИ ====================
            if (step === 'kitchen_style') {
                const styles = [
                    { id: 'modern', title: 'Современный', description: 'Лаконичные формы, глянец', image: IMAGES.kitchen.modern },
                    { id: 'classic', title: 'Классический', description: 'Изящество и благородство', image: IMAGES.kitchen.classic },
                    { id: 'loft', title: 'Лофт', description: 'Индустриальный шик', image: IMAGES.kitchen.loft },
                    { id: 'minimal', title: 'Минимализм', description: 'Чистые линии', image: IMAGES.kitchen.minimal },
                ];
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Кухня: стиль'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Какой стиль вам ближе?')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 1, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'options-grid' },
                        styles.map(style => 
                            React.createElement(OptionCard, {
                                key: style.id,
                                image: style.image,
                                title: style.title,
                                description: style.description,
                                selected: quizData.style === style.id,
                                onClick: () => setQuizData({ ...quizData, style: style.id })
                            })
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { 
                            className: 'button', 
                            disabled: !quizData.style, 
                            onClick: goNext 
                        }, 'Далее')
                    )
                );
            }
            
            // ==================== ЭКРАН МАТЕРИАЛА КУХНИ ====================
            if (step === 'kitchen_material') {
                const materials = [
                    { id: 'plastic', title: 'Пластик', description: 'от 45 000 ₽/м', image: IMAGES.kitchen.modern },
                    { id: 'enamel', title: 'Эмаль', description: 'от 65 000 ₽/м', image: IMAGES.kitchen.classic },
                    { id: 'veneer', title: 'Шпон', description: 'от 85 000 ₽/м', image: IMAGES.kitchen.loft },
                    { id: 'solid', title: 'Массив', description: 'от 120 000 ₽/м', image: IMAGES.kitchen.minimal },
                ];
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Кухня: материал'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Выберите материал фасада')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 2, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'options-grid' },
                        materials.map(material => 
                            React.createElement(OptionCard, {
                                key: material.id,
                                image: material.image,
                                title: material.title,
                                description: material.description,
                                selected: quizData.material === material.id,
                                onClick: () => setQuizData({ ...quizData, material: material.id })
                            })
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { 
                            className: 'button', 
                            disabled: !quizData.material, 
                            onClick: goNext 
                        }, 'Далее')
                    )
                );
            }
            
            // ==================== ЭКРАН РАЗМЕРА КУХНИ ====================
            if (step === 'kitchen_size') {
                const estimatedPrice = Math.round(quizData.length * 45000);
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Кухня: размер'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Какой длины кухня?')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 3, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'price-display' },
                        React.createElement('div', { style: { fontSize: '44px', fontWeight: 'bold' } },
                            quizData.length.toFixed(1) + ' м'
                        ),
                        React.createElement('div', { style: { color: '#666', marginTop: '8px' } },
                            'Примерная стоимость: ' + estimatedPrice.toLocaleString() + ' ₽'
                        )
                    ),
                    
                    React.createElement('div', { className: 'slider-container' },
                        React.createElement('input', {
                            type: 'range',
                            className: 'slider',
                            min: '1',
                            max: '10',
                            step: '0.5',
                            value: quizData.length,
                            onChange: (e) => setQuizData({ ...quizData, length: parseFloat(e.target.value) })
                        }),
                        React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: '8px' } },
                            React.createElement('span', { style: { fontSize: '13px', color: '#666' } }, '1 м'),
                            React.createElement('span', { style: { fontSize: '13px', color: '#666' } }, '10 м')
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { className: 'button', onClick: goNext }, 'Рассчитать')
                    )
                );
            }
            
            // ==================== ЭКРАН ТИПА ШКАФА ====================
            if (step === 'wardrobe_type') {
                const types = [
                    { id: 'built-in', title: 'Встроенный', description: 'Экономит пространство', image: IMAGES.wardrobe.builtin },
                    { id: 'standalone', title: 'Отдельно стоящий', description: 'Можно перемещать', image: IMAGES.wardrobe.standalone },
                ];
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Шкаф: тип'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Какой шкаф вам нужен?')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 1, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'options-grid' },
                        types.map(type => 
                            React.createElement(OptionCard, {
                                key: type.id,
                                image: type.image,
                                title: type.title,
                                description: type.description,
                                selected: quizData.wardrobeType === type.id,
                                onClick: () => setQuizData({ ...quizData, wardrobeType: type.id })
                            })
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { 
                            className: 'button', 
                            disabled: !quizData.wardrobeType, 
                            onClick: goNext 
                        }, 'Далее')
                    )
                );
            }
            
            // ==================== ЭКРАН ДВЕРЕЙ ШКАФА ====================
            if (step === 'wardrobe_door') {
                const doors = [
                    { id: 'sliding', title: 'Шкаф-купе', description: 'Раздвижные двери', image: IMAGES.wardrobe.sliding },
                    { id: 'hinged', title: 'Распашные', description: 'Классические двери', image: IMAGES.wardrobe.hinged },
                ];
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Шкаф: двери'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Какие двери предпочитаете?')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 2, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'options-grid' },
                        doors.map(door => 
                            React.createElement(OptionCard, {
                                key: door.id,
                                image: door.image,
                                title: door.title,
                                description: door.description,
                                selected: quizData.doorType === door.id,
                                onClick: () => setQuizData({ ...quizData, doorType: door.id })
                            })
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { 
                            className: 'button', 
                            disabled: !quizData.doorType, 
                            onClick: goNext 
                        }, 'Далее')
                    )
                );
            }
            
            // ==================== ЭКРАН ШИРИНЫ ШКАФА ====================
            if (step === 'wardrobe_width') {
                const estimatedPrice = Math.round(quizData.width * 35000);
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Шкаф: ширина'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Укажите примерную ширину')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 3, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'price-display' },
                        React.createElement('div', { style: { fontSize: '44px', fontWeight: 'bold' } },
                            quizData.width.toFixed(1) + ' м'
                        ),
                        React.createElement('div', { style: { color: '#666', marginTop: '8px' } },
                            'Примерная стоимость: ' + estimatedPrice.toLocaleString() + ' ₽'
                        )
                    ),
                    
                    React.createElement('div', { className: 'slider-container' },
                        React.createElement('input', {
                            type: 'range',
