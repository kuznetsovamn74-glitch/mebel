<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подбор мебели</title>
    
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .app-container {
            min-height: 100vh;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 0;
        }
        
        .quiz-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .quiz-subtitle {
            font-size: 15px;
            color: #666;
            line-height: 1.4;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .options-grid.two-col {
            grid-template-columns: 1fr 1fr;
        }
        
        .option-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        
        .option-card:active {
            transform: scale(0.97);
        }
        
        .option-card.selected {
            border-color: #4CD964;
            background: #f0fff4;
        }
        
        .option-image {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #f0f0f0;
        }
        
        .option-content {
            flex: 1;
        }
        
        .option-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1a1a1a;
        }
        
        .option-description {
            font-size: 13px;
            color: #666;
            line-height: 1.3;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 16px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #4CD964;
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        
        .progress-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }
        
        .button {
            width: 100%;
            padding: 16px;
            background: #4CD964;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .button-secondary {
            background: #666;
        }
        
        .button-back {
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
        }
        
        .slider-container {
            padding: 10px 0;
        }
        
        .slider {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: #4CD964;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .price-display {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 12px;
            margin: 16px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .price-value {
            font-size: 32px;
            font-weight: 700;
            color: #4CD964;
            line-height: 1.3;
        }
        
        .input-field {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.25s ease;
            background: white;
        }
        
        .input-field:focus {
            border-color: #4CD964;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4CD964;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .buttons-row {
            display: flex;
            gap: 10px;
        }
        
        .buttons-row .button {
            flex: 1;
        }
        
        .phone-button {
            width: auto;
            padding: 14px 16px;
            background: #666;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            text-align: center;
        }
        
        @media (max-width: 400px) {
            .options-grid.two-col {
                grid-template-columns: 1fr;
            }
            .quiz-title {
                font-size: 22px;
            }
            .option-image {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        // ==================== НАСТРОЙКИ ====================
        // ЗАМЕНИТЕ на URL вашего Google Apps Script
        const BACKEND_URL = 'https://script.google.com/macros/s/ВАШ_ID/exec';
        
        // ==================== ФОТОГРАФИИ ====================
        const IMAGES = {
            kitchen: {
                modern: 'https://images.unsplash.com/photo-1556912167-f556f1f39fdf?w=400&h=400&fit=crop',
                classic: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&h=400&fit=crop',
                loft: 'https://images.unsplash.com/photo-1556909212-d5b604d0c90d?w=400&h=400&fit=crop',
                minimal: 'https://images.unsplash.com/photo-1600585152220-90363fe7e115?w=400&h=400&fit=crop',
            },
            wardrobe: {
                builtin: 'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=400&h=400&fit=crop',
                standalone: 'https://images.unsplash.com/photo-1595428774204-7cf6e0b91b57?w=400&h=400&fit=crop',
                sliding: 'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=400&h=400&fit=crop',
                hinged: 'https://images.unsplash.com/photo-1595428774204-7cf6e0b91b57?w=400&h=400&fit=crop',
            }
        };
        
        // ==================== СОСТОЯНИЕ ПРИЛОЖЕНИЯ ====================
        let currentStep = 'type';
        let furnitureType = null;
        let quizData = {
            style: null,
            material: null,
            length: 3,
            wardrobeType: null,
            doorType: null,
            width: 2,
            priceMin: null,
            priceMax: null,
        };
        let userName = '';
        let userPhone = '';
        
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        function initApp() {
            console.log('Приложение запущено (без React)');
            
            // Инициализация VK Bridge
            if (typeof vkBridge !== 'undefined') {
                vkBridge.send('VKWebAppInit');
                console.log('VK Bridge инициализирован');
            }
            
            renderApp();
        }
        
        // ==================== РЕНДЕРИНГ ====================
        function renderApp() {
            const root = document.getElementById('root');
            
            if (currentStep === 'type') {
                renderTypeScreen(root);
            } else if (currentStep === 'kitchen_style') {
                renderKitchenStyleScreen(root);
            } else if (currentStep === 'kitchen_material') {
                renderKitchenMaterialScreen(root);
            } else if (currentStep === 'kitchen_size') {
                renderKitchenSizeScreen(root);
            } else if (currentStep === 'wardrobe_type') {
                renderWardrobeTypeScreen(root);
            } else if (currentStep === 'wardrobe_door') {
                renderWardrobeDoorScreen(root);
            } else if (currentStep === 'wardrobe_width') {
                renderWardrobeWidthScreen(root);
            } else if (currentStep === 'result') {
                renderResultScreen(root);
            }
        }
        
        // ==================== ЭКРАН ВЫБОРА ТИПА ====================
        function renderTypeScreen(root) {
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">Подбор мебели</div>
                        <div class="quiz-subtitle">Что хотели бы рассчитать?</div>
                    </div>
                    
                    <div class="options-grid two-col">
                        <div class="option-card ${furnitureType === 'kitchen' ? 'selected' : ''}" onclick="selectFurnitureType('kitchen')" style="flex-direction: column; text-align: center; padding: 16px;">
                            <div class="option-image" style="width: 100%; height: 150px; margin-bottom: 12px; background-image: url('${IMAGES.kitchen.modern}')"></div>
                            <div class="option-content" style="text-align: center;">
                                <div class="option-title">Кухню</div>
                                <div class="option-description">Рассчитаем стоимость</div>
                            </div>
                        </div>
                        
                        <div class="option-card ${furnitureType === 'wardrobe' ? 'selected' : ''}" onclick="selectFurnitureType('wardrobe')" style="flex-direction: column; text-align: center; padding: 16px;">
                            <div class="option-image" style="width: 100%; height: 150px; margin-bottom: 12px; background-image: url('${IMAGES.wardrobe.sliding}')"></div>
                            <div class="option-content" style="text-align: center;">
                                <div class="option-title">Шкаф</div>
                                <div class="option-description">Подберем идеальный</div>
                            </div>
                        </div>
                    </div>
                    
                    <button class="button" ${!furnitureType ? 'disabled' : ''} onclick="goNext()">Продолжить</button>
                </div>
            `;
        }
        
        // ==================== ЭКРАН СТИЛЯ КУХНИ ====================
        function renderKitchenStyleScreen(root) {
            const styles = [
                { id: 'modern', title: 'Современный', description: 'Лаконичные формы, глянец', image: IMAGES.kitchen.modern },
                { id: 'classic', title: 'Классический', description: 'Изящество и благородство', image: IMAGES.kitchen.classic },
                { id: 'loft', title: 'Лофт', description: 'Индустриальный шик', image: IMAGES.kitchen.loft },
                { id: 'minimal', title: 'Минимализм', description: 'Чистые линии', image: IMAGES.kitchen.minimal },
            ];
            
            let optionsHTML = '';
            styles.forEach(style => {
                optionsHTML += `
                    <div class="option-card ${quizData.style === style.id ? 'selected' : ''}" onclick="selectKitchenStyle('${style.id}')">
                        <div class="option-image" style="background-image: url('${style.image}')"></div>
                        <div class="option-content">
                            <div class="option-title">${style.title}</div>
                            <div class="option-description">${style.description}</div>
                        </div>
                    </div>
                `;
            });
            
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">Кухня: стиль</div>
                        <div class="quiz-subtitle">Какой стиль вам ближе?</div>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 33%"></div>
                    </div>
                    <div class="progress-text">Шаг 1 из 3</div>
                    
                    <div class="options-grid">
                        ${optionsHTML}
                    </div>
                    
                    <div class="buttons-row">
                        <button class="button button-secondary" onclick="goBack()">Назад</button>
                        <button class="button" ${!quizData.style ? 'disabled' : ''} onclick="goNext()">Далее</button>
                    </div>
                </div>
            `;
        }
        
        // ==================== ЭКРАН МАТЕРИАЛА КУХНИ ====================
        function renderKitchenMaterialScreen(root) {
            const materials = [
                { id: 'plastic', title: 'Пластик', description: 'от 45 000 ₽/м', image: IMAGES.kitchen.modern },
                { id: 'enamel', title: 'Эмаль', description: 'от 65 000 ₽/м', image: IMAGES.kitchen.classic },
                { id: 'veneer', title: 'Шпон', description: 'от 85 000 ₽/м', image: IMAGES.kitchen.loft },
                { id: 'solid', title: 'Массив', description: 'от 120 000 ₽/м', image: IMAGES.kitchen.minimal },
            ];
            
            let optionsHTML = '';
            materials.forEach(material => {
                optionsHTML += `
                    <div class="option-card ${quizData.material === material.id ? 'selected' : ''}" onclick="selectKitchenMaterial('${material.id}')">
                        <div class="option-image" style="background-image: url('${material.image}')"></div>
                        <div class="option-content">
                            <div class="option-title">${material.title}</div>
                            <div class="option-description">${material.description}</div>
                        </div>
                    </div>
                `;
            });
            
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">Кухня: материал</div>
                        <div class="quiz-subtitle">Выберите материал фасада</div>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 66%"></div>
                    </div>
                    <div class="progress-text">Шаг 2 из 3</div>
                    
                    <div class="options-grid">
                        ${optionsHTML}
                    </div>
                    
                    <div class="buttons-row">
                        <button class="button button-secondary" onclick="goBack()">Назад</button>
                        <button class="button" ${!quizData.material ? 'disabled' : ''} onclick="goNext()">Далее</button>
                    </div>
                </div>
            `;
        }
        
        // ==================== ЭКРАН РАЗМЕРА КУХНИ ====================
        function renderKitchenSizeScreen(root) {
            const estimatedPrice = Math.round(quizData.length * 45000);
            
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">Кухня: размер</div>
                        <div class="quiz-subtitle">Какой длины кухня?</div>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 100%"></div>
                    </div>
                    <div class="progress-text">Шаг 3 из 3</div>
                    
                    <div class="price-display">
                        <div style="font-size: 44px; font-weight: bold;">${quizData.length.toFixed(1)} м</div>
                        <div style="color: #666; margin-top: 8px;">Примерная стоимость: ${estimatedPrice.toLocaleString()} ₽</div>
                    </div>
                    
                    <div class="slider-container">
                        <input type="range" class="slider" min="1" max="10" step="0.5" value="${quizData.length}" oninput="updateKitchenLength(this.value)">
                        <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                            <span style="font-size: 13px; color: #666;">1 м</span>
                            <span style="font-size: 13px; color: #666;">10 м</span>
                        </div>
                    </div>
                    
                    <div class="buttons-row">
                        <button class="button button-secondary" onclick="goBack()">Назад</button>
                        <button class="button" onclick="goNext()">Рассчитать</button>
                    </div>
                </div>
            `;
        }
        
        // ==================== ЭКРАН ТИПА ШКАФА ====================
        function renderWardrobeTypeScreen(root) {
            const types = [
                { id: 'built-in', title: 'Встроенный', description: 'Экономит пространство', image: IMAGES.wardrobe.builtin },
                { id: 'standalone', title: 'Отдельно стоящий', description: 'Можно перемещать', image: IMAGES.wardrobe.standalone },
            ];
            
            let optionsHTML = '';
            types.forEach(type => {
                optionsHTML += `
                    <div class="option-card ${quizData.wardrobeType === type.id ? 'selected' : ''}" onclick="selectWardrobeType('${type.id}')">
                        <div class="option-image" style="background-image: url('${type.image}')"></div>
                        <div class="option-content">
                            <div class="option-title">${type.title}</div>
                            <div class="option-description">${type.description}</div>
                        </div>
                    </div>
                `;
            });
            
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">Шкаф: тип</div>
                        <div class="quiz-subtitle">Какой шкаф вам нужен?</div>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 33%"></div>
                    </div>
                    <div class="progress-text">Шаг 1 из 3</div>
                    
                    <div class="options-grid">
                        ${optionsHTML}
                    </div>
                    
                    <div class="buttons-row">
                        <button class="button button-secondary" onclick="goBack()">Назад</button>
                        <button class="button" ${!quizData.wardrobeType ? 'disabled' : ''} onclick="goNext()">Далее</button>
                    </div>
                </div>
            `;
        }
        
        // ==================== ЭКРАН ДВЕРЕЙ ШКАФА ====================
        function renderWardrobeDoorScreen(root) {
            const doors = [
                { id: 'sliding', title: 'Шкаф-купе', description: 'Раздвижные двери', image: IMAGES.wardrobe.sliding },
                { id: 'hinged', title: 'Распашные', description: 'Классические двери', image: IMAGES.wardrobe.hinged },
            ];
            
            let optionsHTML = '';
            doors.forEach(door => {
                optionsHTML += `
                    <div class="option-card ${quizData.doorType === door.id ? 'selected' : ''}" onclick="selectWardrobeDoor('${door.id}')">
                        <div class="option-image" style="background-image: url('${door.image}')"></div>
                        <div class="option-content">
                            <div class="option-title">${door.title}</div>
                            <div class="option-description">${door.description}</div>
                        </div>
                    </div>
                `;
            });
            
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">Шкаф: двери</div>
                        <div class="quiz-subtitle">Какие двери предпочитаете?</div>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 66%"></div>
                    </div>
                    <div class="progress-text">Шаг 2 из 3</div>
                    
                    <div class="options-grid">
                        ${optionsHTML}
                    </div>
                    
                    <div class="buttons-row">
                        <button class="button button-secondary" onclick="goBack()">Назад</button>
                        <button class="button" ${!quizData.doorType ? 'disabled' : ''} onclick="goNext()">Далее</button>
                    </div>
                </div>
            `;
        }
        
        // ==================== ЭКРАН ШИРИНЫ ШКАФА ====================
        function renderWardrobeWidthScreen(root) {
            const estimatedPrice = Math.round(quizData.width * 35000);
            
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">Шкаф: ширина</div>
                        <div class="quiz-subtitle">Укажите примерную ширину</div>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 100%"></div>
                    </div>
                    <div class="progress-text">Шаг 3 из 3</div>
                    
                    <div class="price-display">
                        <div style="font-size: 44px; font-weight: bold;">${quizData.width.toFixed(1)} м</div>
                        <div style="color: #666; margin-top: 8px;">Примерная стоимость: ${estimatedPrice.toLocaleString()} ₽</div>
                    </div>
                    
                    <div class="slider-container">
                        <input type="range" class="slider" min="0.5" max="6" step="0.1" value="${quizData.width}" oninput="updateWardrobeWidth(this.value)">
                        <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                            <span style="font-size: 13px; color: #666;">0.5 м</span>
                            <span style="font-size: 13px; color: #666;">6 м</span>
                        </div>
                    </div>
                    
                    <div class="buttons-row">
                        <button class="button button-secondary" onclick="goBack()">Назад</button>
                        <button class="button" onclick="goNext()">Рассчитать</button>
                    </div>
                </div>
            `;
        }
        
        // ==================== ЭКРАН РЕЗУЛЬТАТА ====================
        function renderResultScreen(root) {
            // Рассчитываем цену
            let priceMin, priceMax;
            
            if (furnitureType === 'kitchen') {
                const styleMultiplier = { modern: 1, classic: 1.2, loft: 1.1, minimal: 0.9 };
                const materialMultiplier = { plastic: 1, enamel: 1.3, veneer: 1.5, solid: 2.0 };
                const multiplier = styleMultiplier[quizData.style] * materialMultiplier[quizData.material];
                priceMin = Math.round(45000 * quizData.length * multiplier * 0.9);
                priceMax = Math.round(45000 * quizData.length * multiplier * 1.15);
            } else {
                const typeMultiplier = { 'built-in': 1.1, 'standalone': 1 };
                const doorMultiplier = { 'sliding': 1.15, 'hinged': 1 };
                const multiplier = typeMultiplier[quizData.wardrobeType] * doorMultiplier[quizData.doorType];
                priceMin = Math.round(35000 * quizData.width * multiplier * 0.9);
                priceMax = Math.round(35000 * quizData.width * multiplier * 1.15);
            }
            
            quizData.priceMin = priceMin;
            quizData.priceMax = priceMax;
            
            // Получаем данные пользователя
            if (typeof vkBridge !== 'undefined') {
                vkBridge.send('VKWebAppGetUserInfo')
                    .then(user => {
                        userName = user.first_name + ' ' + user.last_name;
                        const nameInput = document.getElementById('userName');
                        if (nameInput) nameInput.value = userName;
                    })
                    .catch(err => console.log('Не удалось получить данные:', err));
            }
            
            const title = furnitureType === 'kitchen' ? 'Расчет кухни' : 'Расчет шкафа';
            
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">${title}</div>
                    </div>
                    
                    <div class="price-display">

        function showForm() {
            const root = document.getElementById('root');
            
            root.innerHTML = `
                <div class="app-container">
                    <div class="quiz-header">
                        <div class="quiz-title">Оставить заявку</div>
                    </div>
                    
                    <div class="price-display">
                        <div style="color: #666; font-size: 14px;">Примерная стоимость:</div>
                        <div class="price-value">${quizData.priceMin.toLocaleString()} - ${quizData.priceMax.toLocaleString()} ₽</div>
                    </div>
                    
                    <div id="errorBlock"></div>
                    
                    <input class="input-field" type="text" id="userName" placeholder="Ваше имя" value="${userName}">
                    
                    <div style="display: flex; gap: 8px;">
                        <input class="input-field" type="tel" id="userPhone" placeholder="+7 (___) ___-__-__" style="flex: 1;">
                        <button class="phone-button" onclick="getPhoneFromVK()">Из VK</button>
                    </div>
                    
                    <button class="button" onclick="submitLead()">Отправить заявку</button>
                </div>
            `;
        }
        
        // ==================== ПОЛУЧЕНИЕ НОМЕРА ИЗ VK ====================
        async function getPhoneFromVK() {
            if (typeof vkBridge === 'undefined') {
                alert('Функция доступна только в приложении VK');
                return;
            }
            
            try {
                const phoneData = await vkBridge.send('VKWebAppGetPhoneNumber');
                
                if (phoneData && phoneData.phone) {
                    document.getElementById('userPhone').value = phoneData.phone;
                    console.log('Номер получен:', phoneData.phone);
                }
            } catch (error) {
                console.error('Ошибка получения номера:', error);
                alert('Для получения номера нужно разрешить доступ в настройках VK');
            }
        }
        
        // ==================== ОТПРАВКА ЗАЯВКИ ====================
        async function submitLead() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const errorBlock = document.getElementById('errorBlock');
            
            // Валидация
            if (!name) {
                errorBlock.innerHTML = '<div class="error-message">Укажите ваше имя</div>';
                return;
            }
            
            if (!phone) {
                errorBlock.innerHTML = '<div class="error-message">Укажите номер телефона</div>';
                return;
            }
            
            errorBlock.innerHTML = '';
            
            try {
                console.log('Отправка заявки...');
                
                const leadData = {
                    name: name,
                    phone: phone,
                    furnitureType: furnitureType,
                    quiz: quizData,
                };
                
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(leadData),
                });
                
                const result = await response.json();
                console.log('Ответ сервера:', result);
                
                if (result.success) {
                    // Отправляем событие в VK Ads
                    if (typeof vkBridge !== 'undefined') {
                        await vkBridge.send('VKWebAppTrackEvent', {
                            event_name: 'lead_success',
                            event_data: {
                                furniture_type: furnitureType,
                                price: quizData.priceMin,
                            },
                        });
                    }
                    
                    // Показываем экран успеха
                    const root = document.getElementById('root');
                    root.innerHTML = `
                        <div class="app-container">
                            <div class="quiz-header">
                                <div class="quiz-title">Спасибо!</div>
                                <div class="quiz-subtitle">Заявка отправлена</div>
                            </div>
                            
                            <div class="price-display">
                                <div style="font-size: 64px;">✅</div>
                                <div style="margin-top: 16px; font-size: 18px; font-weight: 600;">
                                    Менеджер свяжется с вами в течение 15 минут
                                </div>
                            </div>
                            
                            <button class="button" onclick="closeApp()">Закрыть</button>
                        </div>
                    `;
                } else {
                    errorBlock.innerHTML = '<div class="error-message">Ошибка: ' + (result.error || 'неизвестная ошибка') + '</div>';
                }
            } catch (error) {
                console.error('Ошибка отправки:', error);
                errorBlock.innerHTML = '<div class="error-message">Не удалось отправить заявку. Проверьте соединение.</div>';
            }
        }
        
        // ==================== ЗАКРЫТИЕ ПРИЛОЖЕНИЯ ====================
        function closeApp() {
            if (typeof vkBridge !== 'undefined') {
                vkBridge.send('VKWebAppClose', { status: 'success' });
            }
        }
