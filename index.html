<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подбор мебели</title>
    
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <!-- React и ReactDOM через проверенные CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .app-container {
            min-height: 100vh;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 0;
        }
        
        .quiz-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .quiz-subtitle {
            font-size: 15px;
            color: #666;
            line-height: 1.4;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .options-grid.two-col {
            grid-template-columns: 1fr 1fr;
        }
        
        .option-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            user-select: none;
            -webkit-user-select: none;
        }
        
        .option-card:active {
            transform: scale(0.97);
        }
        
        .option-card.selected {
            border-color: #4CD964;
            background: #f0fff4;
        }
        
        .option-image {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            background: #f0f0f0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        
        .option-content {
            flex: 1;
        }
        
        .option-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1a1a1a;
        }
        
        .option-description {
            font-size: 13px;
            color: #666;
            line-height: 1.3;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 16px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #4CD964;
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        
        .progress-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }
        
        .button {
            width: 100%;
            padding: 16px;
            background: #4CD964;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .button-secondary {
            background: #666;
        }
        
        .button-back {
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
        }
        
        .slider-container {
            padding: 10px 0;
        }
        
        .slider {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: #4CD964;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .price-display {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 12px;
            margin: 16px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .price-value {
            font-size: 32px;
            font-weight: 700;
            color: #4CD964;
            line-height: 1.3;
        }
        
        .input-field {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.25s ease;
        }
        
        .input-field:focus {
            border-color: #4CD964;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4CD964;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .buttons-row {
            display: flex;
            gap: 10px;
        }
        
        .buttons-row .button {
            flex: 1;
        }
        
        @media (max-width: 400px) {
            .options-grid.two-col {
                grid-template-columns: 1fr;
            }
            .quiz-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        // Проверяем, что React загрузился
        if (typeof React === 'undefined') {
            document.getElementById('root').innerHTML = 
                '<div style="text-align:center;padding:40px;font-family:Arial;">' +
                '<h2>Ошибка загрузки React</h2>' +
                '<p>Проверьте интернет-соединение и обновите страницу</p>' +
                '</div>';
        } else {
            console.log('React загружен успешно');
        }
        
        const { useState, useEffect } = React;
        
        // ==================== ГЛАВНЫЙ КОМПОНЕНТ ====================
        function App() {
            const [step, setStep] = useState('type');
            const [furnitureType, setFurnitureType] = useState(null);
            const [quizData, setQuizData] = useState({
                style: null,
                material: null,
                length: 3,
                wardrobeType: null,
                doorType: null,
                width: 2,
                priceMin: null,
                priceMax: null,
            });
            const [userData, setUserData] = useState(null);
            
            useEffect(() => {
                console.log('Приложение запущено');
                
                // Инициализация VK Bridge
                if (typeof vkBridge !== 'undefined') {
                    vkBridge.send('VKWebAppInit');
                    console.log('VK Bridge инициализирован');
                }
            }, []);
            
            const goNext = () => {
                const nextMap = {
                    'type': () => furnitureType === 'kitchen' ? 'kitchen_style' : 'wardrobe_type',
                    'kitchen_style': 'kitchen_material',
                    'kitchen_material': 'kitchen_size',
                    'kitchen_size': 'result',
                    'wardrobe_type': 'wardrobe_door',
                    'wardrobe_door': 'wardrobe_width',
                    'wardrobe_width': 'result',
                };
                
                const next = nextMap[step];
                if (typeof next === 'function') {
                    setStep(next());
                } else if (next) {
                    setStep(next);
                }
            };
            
            const goBack = () => {
                const backMap = {
                    'kitchen_style': 'type',
                    'kitchen_material': 'kitchen_style',
                    'kitchen_size': 'kitchen_material',
                    'wardrobe_type': 'type',
                    'wardrobe_door': 'wardrobe_type',
                    'wardrobe_width': 'wardrobe_door',
                    'result': furnitureType === 'kitchen' ? 'kitchen_size' : 'wardrobe_width',
                };
                setStep(backMap[step] || 'type');
            };
            
            // ==================== ЭКРАН ВЫБОРА ТИПА ====================
            if (step === 'type') {
                return (
                    <div className="app-container">
                        <div className="quiz-header">
                            <div className="quiz-title">Подбор мебели</div>
                            <div className="quiz-subtitle">Что хотели бы рассчитать?</div>
                        </div>
                        
                        <div className="options-grid two-col">
                            <div 
                                className={`option-card ${furnitureType === 'kitchen' ? 'selected' : ''}`}
                                onClick={() => setFurnitureType('kitchen')}
                                style={{ flexDirection: 'column', textAlign: 'center', padding: '24px 16px' }}
                            >
                                <div className="option-image" style={{ width: '80px', height: '80px' }}>🍳</div>
                                <div className="option-content" style={{ textAlign: 'center' }}>
                                    <div className="option-title">Кухню</div>
                                    <div className="option-description">Рассчитаем стоимость</div>
                                </div>
                            </div>
                            
                            <div 
                                className={`option-card ${furnitureType === 'wardrobe' ? 'selected' : ''}`}
                                onClick={() => setFurnitureType('wardrobe')}
                                style={{ flexDirection: 'column', textAlign: 'center', padding: '24px 16px' }}
                            >
                                <div className="option-image" style={{ width: '80px', height: '80px' }}>🚪</div>
                                <div className="option-content" style={{ textAlign: 'center' }}>
                                    <div className="option-title">Шкаф</div>
                                    <div className="option-description">Подберем идеальный</div>
                                </div>
                            </div>
                        </div>
                        
                        <button 
                            className="button" 
                            disabled={!furnitureType}
                            onClick={goNext}
                        >
                            Продолжить
                        </button>
                    </div>
                );
            }
            
            // ==================== ЭКРАН СТИЛЯ КУХНИ ====================
            if (step === 'kitchen_style') {
                const styles = [
                    { id: 'modern', title: 'Современный', description: 'Лаконичные формы, глянец', icon: '🏢' },
                    { id: 'classic', title: 'Классический', description: 'Изящество и благородство', icon: '🏛️' },
                    { id: 'loft', title: 'Лофт', description: 'Индустриальный шик', icon: '🏭' },
                    { id: 'minimal', title: 'Минимализм', description: 'Чистые линии', icon: '⬜' },
                ];
                
                return (
                    <div className="app-container">
                        <div className="quiz-header">
                            <div className="quiz-title">Кухня: стиль</div>
                            <div className="quiz-subtitle">Какой стиль вам ближе?</div>
                        </div>
                        
                        <div style={{ marginBottom: '20px' }}>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: '33%' }}></div>
                            </div>
                            <div className="progress-text">Шаг 1 из 3</div>
                        </div>
                        
                        <div className="options-grid">
                            {styles.map(style => (
                                <div 
                                    key={style.id}
                                    className={`option-card ${quizData.style === style.id ? 'selected' : ''}`}
                                    onClick={() => setQuizData({ ...quizData, style: style.id })}
                                >
                                    <div className="option-image">{style.icon}</div>
                                    <div className="option-content">
                                        <div className="option-title">{style.title}</div>
                                        <div className="option-description">{style.description}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="buttons-row">
                            <button className="button button-secondary" onClick={goBack}>Назад</button>
                            <button className="button" disabled={!quizData.style} onClick={goNext}>Далее</button>
                        </div>
                    </div>
                );
            }
            
            // ==================== ЭКРАН МАТЕРИАЛА КУХНИ ====================
            if (step === 'kitchen_material') {
                const materials = [
                    { id: 'plastic', title: 'Пластик', price: 'от 45 000 ₽/м', icon: '🔲' },
                    { id: 'enamel', title: 'Эмаль', price: 'от 65 000 ₽/м', icon: '🎨' },
                    { id: 'veneer', title: 'Шпон', price: 'от 85 000 ₽/м', icon: '🪵' },
                    { id: 'solid', title: 'Массив', price: 'от 120 000 ₽/м', icon: '🌳' },
                ];
                
                return (
                    <div className="app-container">
                        <div className="quiz-header">
                            <div className="quiz-title">Кухня: материал</div>
                            <div className="quiz-subtitle">Выберите материал фасада</div>
                        </div>
                        
                        <div style={{ marginBottom: '20px' }}>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: '66%' }}></div>
                            </div>
                            <div className="progress-text">Шаг 2 из 3</div>
                        </div>
                        
                        <div className="options-grid">
                            {materials.map(material => (
                                <div 
                                    key={material.id}
                                    className={`option-card ${quizData.material === material.id ? 'selected' : ''}`}
                                    onClick={() => setQuizData({ ...quizData, material: material.id })}
                                >
                                    <div className="option-image">{material.icon}</div>
                                    <div className="option-content">
                                        <div className="option-title">{material.title}</div>
                                        <div className="option-description">{material.price}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="buttons-row">
                            <button className="button button-secondary" onClick={goBack}>Назад</button>
                            <button className="button" disabled={!quizData.material} onClick={goNext}>Далее</button>
                        </div>
                    </div>
                );
            }
            
            // ==================== ЭКРАН РАЗМЕРА КУХНИ ====================
            if (step === 'kitchen_size') {
                const estimatedPrice = Math.round(quizData.length * 45000);
                
                return (
                    <div className="app-container">
                        <div className="quiz-header">
                            <div className="quiz-title">Кухня: размер</div>
                            <div className="quiz-subtitle">Какой длины кухня?</div>
                        </div>
                        
                        <div style={{ marginBottom: '20px' }}>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: '100%' }}></div>
                            </div>
                            <div className="progress-text">Шаг 3 из 3</div>
                        </div>
                        
                        <div className="price-display">
                            <div style={{ fontSize: '44px', fontWeight: 'bold' }}>
                                {quizData.length.toFixed(1)} м
                            </div>
                            <div style={{ color: '#666', marginTop: '8px' }}>
                                Примерная стоимость: {estimatedPrice.toLocaleString()} ₽
                            </div>
                        </div>
                        
                        <div className="slider-container">
                            <input 
                                type="range"
                                className="slider"
                                min="1"
                                max="10"
                                step="0.5"
                                value={quizData.length}
                                onChange={(e) => setQuizData({ ...quizData, length: parseFloat(e.target.value) })}
                            />
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '8px' }}>
                                <span style={{ fontSize: '13px', color: '#666' }}>1 м</span>
                                <span style={{ fontSize: '13px', color: '#666' }}>10 м</span>
                            </div>
                        </div>
                        
                        <div className="buttons-row">
                            <button className="button button-secondary" onClick={goBack}>Назад</button>
                            <button className="button" onClick={goNext}>Рассчитать</button>
                        </div>
                    </div>
                );
            }
            
            // ==================== ЭКРАН ТИПА ШКАФА ====================
            if (step === 'wardrobe_type') {
                const types = [
                    { id: 'built-in', title: 'Встроенный', description: 'Экономит пространство', icon: '🧱' },
                    { id: 'standalone', title: 'Отдельно стоящий', description: 'Можно перемещать', icon: '🗄️' },
                ];
                
                return (
                    <div className="app-container">
                        <div className="quiz-header">
                            <div className="quiz-title">Шкаф: тип</div>
                            <div className="quiz-subtitle">Какой шкаф вам нужен?</div>
                        </div>
                        
                        <div style={{ marginBottom: '20px' }}>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: '33%' }}></div>
                            </div>
                            <div className="progress-text">Шаг 1 из 3</div>
                        </div>
                        
                        <div className="options-grid">
                            {types.map(type => (
                                <div 
                                    key={type.id}
                                    className={`option-card ${quizData.wardrobeType === type.id ? 'selected' : ''}`}
                                    onClick={() => setQuizData({ ...quizData, wardrobeType: type.id })}
                                >
                                    <div className="option-image">{type.icon}</div>
                                    <div className="option-content">
                                        <div className="option-title">{type.title}</div>
                                        <div className="option-description">{type.description}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="buttons-row">
                            <button className="button button-secondary" onClick={goBack}>Назад</button>
                            <button className="button" disabled={!quizData.wardrobeType} onClick={goNext}>Далее</button>
                        </div>
                    </div>
                );
            }
            
            // ==================== ЭКРАН ДВЕРЕЙ ШКАФА ====================
            if (step === 'wardrobe_door') {
                const doors = [
                    { id: 'sliding', title: 'Шкаф-купе', description: 'Раздвижные двери', icon: '🚪' },
                    { id: 'hinged', title: 'Распашные', description: 'Классические двери', icon: '🔓' },
                ];
                
                return (
                    <div className="app-container">
                        <div className="quiz-header">
                            <div className="quiz-title">Шкаф: двери</div>
                            <div className="quiz-subtitle">Какие двери предпочитаете?</div>
                        </div>
                        
                        <div style={{ marginBottom: '20px' }}>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: '66%' }}></div>
                            </div>
                            <div className="progress-text">Шаг 2 из 3</div>
                        </div>
                        
                        <div className="options-grid">
                            {doors.map(door => (
                                <div 
                                    key={door.id}
                                    className={`option-card ${quizData.doorType === door.id ? 'selected' : ''}`}
                                    onClick={() => setQuizData({ ...quizData, doorType: door.id })}
                                >
                                    <div className="option-image">{door.icon}</div>
                                    <div className="option-content">
                                        <div className="option-title">{door.title}</div>
                                        <div className="option-description">{door.description}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="buttons-row">
                            <button className="button button-secondary" onClick={goBack}>Назад</button>
                            <button className="button" disabled={!quizData.doorType} onClick={goNext}>Далее</button>
                        </div>
                    </div>
                );
            }
            
            // ==================== ЭКРАН ШИРИНЫ ШКАФА ====================
            if (step === 'wardrobe_width') {
                const estimatedPrice = Math.round(quizData.width * 35000);
                
                return (
                    <div className="app-container">
                        <div className="quiz-header">
                            <div className="quiz-title">Шкаф: ширина</div>
                            <div className="quiz-subtitle">Укажите примерную ширину</div>
                        </div>
                        
                        <div style={{ marginBottom: '20px' }}>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: '100%' }}></div>
                            </div>
                            <div className="progress-text">Шаг 3 из 3</div>
                        </div>
                        
                        <div className="price-display">
                            <div style={{ fontSize: '44px', fontWeight: 'bold' }}>
                                {quizData.width.toFixed(1)} м
                            </div>
                            <div style={{ color: '#666', marginTop: '8px' }}>
                                Примерная стоимость: {estimatedPrice.toLocaleString()} ₽
                            </div>
                        </div>
                        
                        <div className="slider-container">
                            <input 
                                type="range"
                                className="slider"
                                min="0.5"
                                max="6"
                                step="0.1"
                                value={quizData.width}
                                onChange={(e) => setQuizData({ ...quizData, width: parseFloat(e.target.value) })}
                            />
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '8px' }}>
                                <span style={{ fontSize: '13px', color: '#666' }}>0.5 м</span>
                                <span style={{ fontSize: '13px', color: '#666' }}>6 м</span>
                            </div>
                        </div>
                        
                        <div className="buttons-row">
                            <button className="button button-secondary" onClick={goBack}>Назад</button>
                            <button className="button" onClick={goNext}>Рассчитать</button>
                        </div>
                    </div>
                );
            }
            
            // ==================== ЭКРАН РЕЗУЛЬТАТА ====================
            if (step === 'result') {
                const [loading, setLoading] = React.useState(true);
                const [showForm, setShowForm] = React.useState(false);
                const [name, setName] = React.useState('');
                const [phone, setPhone] = React.useState('');
                const [submitted, setSubmitted] = React.useState(false);
                
                React.useEffect(() => {
                    // Получаем данные пользователя
                    if (typeof vkBridge !== 'undefined') {
                        vkBridge.send('VKWebAppGetUserInfo')
                            .then(user => {
                                setUserData(user);
                                setName(user.first_name + ' ' + user.last_name);
                            })
                            .catch(err => console.log('Не удалось получить данные:', err));
                    }
                    
                    // Рассчитываем цену
                    setTimeout(() => {
                        let priceMin, priceMax;
                        
                        if (furnitureType === 'kitchen') {
                            const styleMultiplier = { modern: 1, classic: 1.2, loft: 1.1, minimal: 0.9 };
                            const materialMultiplier = { plastic: 1, enamel: 1.3, veneer: 1.5, solid: 2.0 };
                            const multiplier = styleMultiplier[quizData.style] * materialMultiplier[quizData.material];
                            priceMin = Math.round(45000 * quizData.length * multiplier * 0.9);
                            priceMax = Math.round(45000 * quizData.length * multiplier * 1.15);
                        } else {
                            const typeMultiplier = { 'built-in': 1.1, 'standalone': 1 };
                            const doorMultiplier = { 'sliding': 1.15, 'hinged': 1 };
                            const multiplier = typeMultiplier[quizData.wardrobeType] * doorMultiplier[quizData.doorType];
                            priceMin = Math.round(35000 * quizData.width * multiplier * 0.9);
                            priceMax = Math.round(35000 * quizData.width * multiplier * 1.15);
                        }
                        
                        setQuizData({ ...quizData, priceMin, priceMax });
                        setLoading(false);
                    }, 800);
                }, []);
                
                const handleGetPhone = async () => {
                    if (typeof vkBridge !== 'undefined') {
                        try {
                            const phoneData = await vkBridge.send('VKWebAppGetPhoneNumber');
                            if (phoneData.phone) {
                                setPhone(phoneData.phone);
                            }
                        } catch (error) {
                            console.log('Пользователь отказался дать номер');
                        }
                    }
                };
                
                const handleSubmit = async () => {
                    if (!name || !phone) {
                        alert('Заполните имя и телефон');
                        return;
                    }
                    
                    console.log('Отправка заявки:', {
                        name,
                        phone,
                        furnitureType,
                        quiz: quizData,
                    });
                    
                    // Здесь будет отправка на сервер
                    
                    setSubmitted(true);
                };
                
                if (loading) {
                    return (
                        <div className="app-container">
                            <div className="loading">
                                <div className="spinner"></div>
                                <div>Считаем стоимость...</div>
                            </div>
                        </div>
                    );
                }
                
                if (submitted) {
                    return (
                        <div className="app-container">
                            <div className="quiz-header">
                                <div className="quiz-title">Спасибо!</div>
                                <div className="quiz-subtitle">Заявка отправлена</div>
                            </div>
                            
                            <div className="price-display">
                                <div style={{ fontSize: '64px' }}>✅</div>
                                <div style={{ marginTop: '16px', fontSize: '18px', fontWeight: '600' }}>
                                    Менеджер свяжется с вами в течение 15 минут
                                </div>
                            </div>
                            
                            <button className="button" onClick={() => {
                                if (typeof vkBridge !== 'undefined') {
                                    vkBridge.send('VKWebAppClose', { status: 'success' });
                                }
                            }}>
                                Закрыть
                            </button>
                        </div>
                    );
                }
                
                return (
                    <div className="app-container">
                        <div className="quiz-header">
                            <div className="quiz-title">
                                {furnitureType === 'kitchen' ? 'Расчет кухни' : 'Расчет шкафа'}
                            </div>
                        </div>
                        
                        <div className="price-display">
                            <div style={{ color: '#666', fontSize: '14px' }}>Примерная стоимость:</div>
                            <div className="price-value">
                                {quizData.priceMin?.toLocaleString()} - {quizData.priceMax?.toLocaleString()} ₽
                            </div>
                        </div>
                        
                        {!showForm ? (
                            <button className="button" onClick={() => setShowForm(true)}>
                                Получить точный расчет + Дизайн-проект бесплатно
                            </button>
                        ) : (
                            <div>
                                <input 
                                    className="input-field"
                                    type="text"
                                    placeholder="Ваше имя"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                />
                                
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <input 
                                        className="input-field"
                                        type="tel"
                                        placeholder="+7 (___) ___-__-__"
                                        value={phone}
                                        onChange={(e) => setPhone(e.target.value)}
                                        style={{ flex: 1 }}
                                    />
                                    <button 
                                        className="button"
                                        style={{ width: 'auto', padding: '14px', background: '#666', fontSize: '13px' }}
                                        onClick={handleGetPhone}
                                    >
                                        Из VK
                                    </button>
                                </div>
                                
                                <button className="button" onClick={handleSubmit}>
                                    Отправить заявку
                                </button>
                            </div>
                        )}
                        
                        <button className="button button-back" style={{ marginTop: '12px' }} onClick={goBack}>
                            Изменить параметры
                        </button>
                    </div>
                );
            }
            
            return null;
        }
        
        // ==================== РЕНДЕРИНГ ====================
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
