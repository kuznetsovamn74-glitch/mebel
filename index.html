<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подбор мебели</title>
    
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <!-- React и ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel для JSX (если нужен) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .app-container {
            min-height: 100vh;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 0;
        }
        
        .quiz-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .quiz-subtitle {
            font-size: 15px;
            color: #666;
            line-height: 1.4;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .options-grid.two-col {
            grid-template-columns: 1fr 1fr;
        }
        
        .option-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            user-select: none;
            -webkit-user-select: none;
        }
        
        .option-card:active {
            transform: scale(0.97);
        }
        
        .option-card.selected {
            border-color: #4CD964;
            background: #f0fff4;
        }
        
        .option-image {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            background: #f0f0f0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        
        .option-content {
            flex: 1;
        }
        
        .option-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1a1a1a;
        }
        
        .option-description {
            font-size: 13px;
            color: #666;
            line-height: 1.3;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 16px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #4CD964;
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        
        .progress-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }
        
        .button {
            width: 100%;
            padding: 16px;
            background: #4CD964;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .button-secondary {
            background: #666;
        }
        
        .button-back {
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
        }
        
        .slider-container {
            padding: 10px 0;
        }
        
        .slider {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: #4CD964;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .price-display {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 12px;
            margin: 16px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .price-value {
            font-size: 32px;
            font-weight: 700;
            color: #4CD964;
            line-height: 1.3;
        }
        
        .input-field {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.25s ease;
        }
        
        .input-field:focus {
            border-color: #4CD964;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4CD964;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .buttons-row {
            display: flex;
            gap: 10px;
        }
        
        .buttons-row .button {
            flex: 1;
        }
        
        @media (max-width: 400px) {
            .options-grid.two-col {
                grid-template-columns: 1fr;
            }
            .quiz-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        console.log('Скрипт запущен');
        console.log('React:', typeof React);
        console.log('ReactDOM:', typeof ReactDOM);
        
        // Проверяем загрузку React
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            document.getElementById('root').innerHTML = 
                '<div style="text-align:center;padding:40px;font-family:Arial;">' +
                '<h2>Ошибка загрузки React</h2>' +
                '<p>Проверьте интернет-соединение</p>' +
                '</div>';
            throw new Error('React не загружен');
        }
        
        const { useState, useEffect } = React;
        
        // ==================== КОМПОНЕНТ ПРОГРЕСС-БАРА ====================
        function ProgressBar({ currentStep, totalSteps }) {
            const percentage = (currentStep / totalSteps) * 100;
            
            return React.createElement('div', null,
                React.createElement('div', { className: 'progress-bar' },
                    React.createElement('div', { 
                        className: 'progress-fill', 
                        style: { width: percentage + '%' } 
                    })
                ),
                React.createElement('div', { className: 'progress-text' },
                    'Шаг ' + currentStep + ' из ' + totalSteps
                )
            );
        }
        
        // ==================== КОМПОНЕНТ КАРТОЧКИ ====================
        function OptionCard({ icon, title, description, selected, onClick, column }) {
            const cardStyle = column ? 
                { flexDirection: 'column', textAlign: 'center', padding: '24px 16px' } : 
                {};
            
            return React.createElement('div', {
                className: 'option-card' + (selected ? ' selected' : ''),
                onClick: onClick,
                style: cardStyle
            },
                React.createElement('div', { 
                    className: 'option-image',
                    style: column ? { width: '80px', height: '80px' } : {}
                }, icon),
                React.createElement('div', { 
                    className: 'option-content',
                    style: column ? { textAlign: 'center' } : {}
                },
                    React.createElement('div', { className: 'option-title' }, title),
                    React.createElement('div', { className: 'option-description' }, description)
                )
            );
        }
        
        // ==================== ГЛАВНЫЙ КОМПОНЕНТ ====================
        function App() {
            const [step, setStep] = useState('type');
            const [furnitureType, setFurnitureType] = useState(null);
            const [quizData, setQuizData] = useState({
                style: null,
                material: null,
                length: 3,
                wardrobeType: null,
                doorType: null,
                width: 2,
                priceMin: null,
                priceMax: null,
            });
            
            useEffect(() => {
                console.log('Приложение запущено');
                
                if (typeof vkBridge !== 'undefined') {
                    vkBridge.send('VKWebAppInit');
                    console.log('VK Bridge инициализирован');
                }
            }, []);
            
            const goNext = () => {
                const nextMap = {
                    'type': () => furnitureType === 'kitchen' ? 'kitchen_style' : 'wardrobe_type',
                    'kitchen_style': 'kitchen_material',
                    'kitchen_material': 'kitchen_size',
                    'kitchen_size': 'result',
                    'wardrobe_type': 'wardrobe_door',
                    'wardrobe_door': 'wardrobe_width',
                    'wardrobe_width': 'result',
                };
                
                const next = nextMap[step];
                if (typeof next === 'function') {
                    setStep(next());
                } else if (next) {
                    setStep(next);
                }
            };
            
            const goBack = () => {
                const backMap = {
                    'kitchen_style': 'type',
                    'kitchen_material': 'kitchen_style',
                    'kitchen_size': 'kitchen_material',
                    'wardrobe_type': 'type',
                    'wardrobe_door': 'wardrobe_type',
                    'wardrobe_width': 'wardrobe_door',
                    'result': furnitureType === 'kitchen' ? 'kitchen_size' : 'wardrobe_width',
                };
                setStep(backMap[step] || 'type');
            };
            
            // ==================== ЭКРАН ВЫБОРА ТИПА ====================
            if (step === 'type') {
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Подбор мебели'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Что хотели бы рассчитать?')
                    ),
                    
                    React.createElement('div', { className: 'options-grid two-col' },
                        React.createElement(OptionCard, {
                            icon: '🍳',
                            title: 'Кухню',
                            description: 'Рассчитаем стоимость',
                            selected: furnitureType === 'kitchen',
                            onClick: () => setFurnitureType('kitchen'),
                            column: true
                        }),
                        React.createElement(OptionCard, {
                            icon: '🚪',
                            title: 'Шкаф',
                            description: 'Подберем идеальный',
                            selected: furnitureType === 'wardrobe',
                            onClick: () => setFurnitureType('wardrobe'),
                            column: true
                        })
                    ),
                    
                    React.createElement('button', {
                        className: 'button',
                        disabled: !furnitureType,
                        onClick: goNext
                    }, 'Продолжить')
                );
            }
            
            // ==================== ЭКРАН СТИЛЯ КУХНИ ====================
            if (step === 'kitchen_style') {
                const styles = [
                    { id: 'modern', title: 'Современный', description: 'Лаконичные формы, глянец', icon: '🏢' },
                    { id: 'classic', title: 'Классический', description: 'Изящество и благородство', icon: '🏛️' },
                    { id: 'loft', title: 'Лофт', description: 'Индустриальный шик', icon: '🏭' },
                    { id: 'minimal', title: 'Минимализм', description: 'Чистые линии', icon: '⬜' },
                ];
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Кухня: стиль'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Какой стиль вам ближе?')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 1, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'options-grid' },
                        styles.map(style => 
                            React.createElement(OptionCard, {
                                key: style.id,
                                icon: style.icon,
                                title: style.title,
                                description: style.description,
                                selected: quizData.style === style.id,
                                onClick: () => setQuizData({ ...quizData, style: style.id })
                            })
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { 
                            className: 'button', 
                            disabled: !quizData.style, 
                            onClick: goNext 
                        }, 'Далее')
                    )
                );
            }
            
            // ==================== ЭКРАН МАТЕРИАЛА КУХНИ ====================
            if (step === 'kitchen_material') {
                const materials = [
                    { id: 'plastic', title: 'Пластик', description: 'от 45 000 ₽/м', icon: '🔲' },
                    { id: 'enamel', title: 'Эмаль', description: 'от 65 000 ₽/м', icon: '🎨' },
                    { id: 'veneer', title: 'Шпон', description: 'от 85 000 ₽/м', icon: '🪵' },
                    { id: 'solid', title: 'Массив', description: 'от 120 000 ₽/м', icon: '🌳' },
                ];
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Кухня: материал'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Выберите материал фасада')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 2, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'options-grid' },
                        materials.map(material => 
                            React.createElement(OptionCard, {
                                key: material.id,
                                icon: material.icon,
                                title: material.title,
                                description: material.description,
                                selected: quizData.material === material.id,
                                onClick: () => setQuizData({ ...quizData, material: material.id })
                            })
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { 
                            className: 'button', 
                            disabled: !quizData.material, 
                            onClick: goNext 
                        }, 'Далее')
                    )
                );
            }
            
            // ==================== ЭКРАН РАЗМЕРА КУХНИ ====================
            if (step === 'kitchen_size') {
                const estimatedPrice = Math.round(quizData.length * 45000);
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Кухня: размер'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Какой длины кухня?')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 3, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'price-display' },
                        React.createElement('div', { style: { fontSize: '44px', fontWeight: 'bold' } },
                            quizData.length.toFixed(1) + ' м'
                        ),
                        React.createElement('div', { style: { color: '#666', marginTop: '8px' } },
                            'Примерная стоимость: ' + estimatedPrice.toLocaleString() + ' ₽'
                        )
                    ),
                    
                    React.createElement('div', { className: 'slider-container' },
                        React.createElement('input', {
                            type: 'range',
                            className: 'slider',
                            min: '1',
                            max: '10',
                            step: '0.5',
                            value: quizData.length,
                            onChange: (e) => setQuizData({ ...quizData, length: parseFloat(e.target.value) })
                        }),
                        React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: '8px' } },
                            React.createElement('span', { style: { fontSize: '13px', color: '#666' } }, '1 м'),
                            React.createElement('span', { style: { fontSize: '13px', color: '#666' } }, '10 м')
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { className: 'button', onClick: goNext }, 'Рассчитать')
                    )
                );
            }
            
            // ==================== ЭКРАН ТИПА ШКАФА ====================
            if (step === 'wardrobe_type') {
                const types = [
                    { id: 'built-in', title: 'Встроенный', description: 'Экономит пространство', icon: '🧱' },
                    { id: 'standalone', title: 'Отдельно стоящий', description: 'Можно перемещать', icon: '🗄️' },
                ];
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Шкаф: тип'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Какой шкаф вам нужен?')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 1, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'options-grid' },
                        types.map(type => 
                            React.createElement(OptionCard, {
                                key: type.id,
                                icon: type.icon,
                                title: type.title,
                                description: type.description,
                                selected: quizData.wardrobeType === type.id,
                                onClick: () => setQuizData({ ...quizData, wardrobeType: type.id })
                            })
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { 
                            className: 'button', 
                            disabled: !quizData.wardrobeType, 
                            onClick: goNext 
                        }, 'Далее')
                    )
                );
            }
            
            // ==================== ЭКРАН ДВЕРЕЙ ШКАФА ====================
            if (step === 'wardrobe_door') {
                const doors = [
                    { id: 'sliding', title: 'Шкаф-купе', description: 'Раздвижные двери', icon: '🚪' },
                    { id: 'hinged', title: 'Распашные', description: 'Классические двери', icon: '🔓' },
                ];
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Шкаф: двери'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Какие двери предпочитаете?')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 2, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'options-grid' },
                        doors.map(door => 
                            React.createElement(OptionCard, {
                                key: door.id,
                                icon: door.icon,
                                title: door.title,
                                description: door.description,
                                selected: quizData.doorType === door.id,
                                onClick: () => setQuizData({ ...quizData, doorType: door.id })
                            })
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { 
                            className: 'button', 
                            disabled: !quizData.doorType, 
                            onClick: goNext 
                        }, 'Далее')
                    )
                );
            }
            
            // ==================== ЭКРАН ШИРИНЫ ШКАФА ====================
            if (step === 'wardrobe_width') {
                const estimatedPrice = Math.round(quizData.width * 35000);
                
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Шкаф: ширина'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Укажите примерную ширину')
                    ),
                    
                    React.createElement(ProgressBar, { currentStep: 3, totalSteps: 3 }),
                    
                    React.createElement('div', { className: 'price-display' },
                        React.createElement('div', { style: { fontSize: '44px', fontWeight: 'bold' } },
                            quizData.width.toFixed(1) + ' м'
                        ),
                        React.createElement('div', { style: { color: '#666', marginTop: '8px' } },
                            'Примерная стоимость: ' + estimatedPrice.toLocaleString() + ' ₽'
                        )
                    ),
                    
                    React.createElement('div', { className: 'slider-container' },
                        React.createElement('input', {
                            type: 'range',
                            className: 'slider',
                            min: '0.5',
                            max: '6',
                            step: '0.1',
                            value: quizData.width,
                            onChange: (e) => setQuizData({ ...quizData, width: parseFloat(e.target.value) })
                        }),
                        React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: '8px' } },
                            React.createElement('span', { style: { fontSize: '13px', color: '#666' } }, '0.5 м'),
                            React.createElement('span', { style: { fontSize: '13px', color: '#666' } }, '6 м')
                        )
                    ),
                    
                    React.createElement('div', { className: 'buttons-row' },
                        React.createElement('button', { className: 'button button-secondary', onClick: goBack }, 'Назад'),
                        React.createElement('button', { className: 'button', onClick: goNext }, 'Рассчитать')
                    )
                );
            }
            
            // ==================== ЭКРАН РЕЗУЛЬТАТА ====================
            if (step === 'result') {
                return React.createElement(ResultScreen, { 
                    furnitureType, 
                    quizData, 
                    setQuizData,
                    goBack 
                });
            }
            
            return null;
        }
        
        // ==================== КОМПОНЕНТ РЕЗУЛЬТАТА ====================
        function ResultScreen({ furnitureType, quizData, setQuizData, goBack }) {
            const [loading, setLoading] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [submitted, setSubmitted] = useState(false);
            
            useEffect(() => {
                console.log('Расчет цены...');
                
                // Получаем данные пользователя VK
                if (typeof vkBridge !== 'undefined') {
                    vkBridge.send('VKWebAppGetUserInfo')
                        .then(user => {
                            setName(user.first_name + ' ' + user.last_name);
                        })
                        .catch(err => console.log('Не удалось получить данные:', err));
                }
                
                // Рассчитываем цену
                setTimeout(() => {
                    let priceMin, priceMax;
                    
                    if (furnitureType === 'kitchen') {
                        const styleMultiplier = { modern: 1, classic: 1.2, loft: 1.1, minimal: 0.9 };
                        const materialMultiplier = { plastic: 1, enamel: 1.3, veneer: 1.5, solid: 2.0 };
                        const multiplier = styleMultiplier[quizData.style] * materialMultiplier[quizData.material];
                        priceMin = Math.round(45000 * quizData.length * multiplier * 0.9);
                        priceMax = Math.round(45000 * quizData.length * multiplier * 1.15);
                    } else {
                        const typeMultiplier = { 'built-in': 1.1, 'standalone': 1 };
                        const doorMultiplier = { 'sliding': 1.15, 'hinged': 1 };
                        const multiplier = typeMultiplier[quizData.wardrobeType] * doorMultiplier[quizData.doorType];
                        priceMin = Math.round(35000 * quizData.width * multiplier * 0.9);
                        priceMax = Math.round(35000 * quizData.width * multiplier * 1.15);
                    }
                    
                    setQuizData({ ...quizData, priceMin, priceMax });
                    setLoading(false);
                }, 800);
            }, []);
            
            const handleGetPhone = async () => {
                if (typeof vkBridge !== 'undefined') {
                    try {
                        const phoneData = await vkBridge.send('VKWebAppGetPhoneNumber');
                        if (phoneData.phone) {
                            setPhone(phoneData.phone);
                        }
                    } catch (error) {
                        console.log('Пользователь отказался дать номер');
                    }
                }
            };
            
            const handleSubmit = () => {
                if (!name || !phone) {
                    alert('Заполните имя и телефон');
                    return;
                }
                
                console.log('Заявка отправлена:', {
                    name: name,
                    phone: phone,
                    furnitureType: furnitureType,
                    quiz: quizData,
                });
                
                setSubmitted(true);
            };
            
            if (loading) {
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'loading' },
                        React.createElement('div', { className: 'spinner' }),
                        React.createElement('div', null, 'Считаем стоимость...')
                    )
                );
            }
            
            if (submitted) {
                return React.createElement('div', { className: 'app-container' },
                    React.createElement('div', { className: 'quiz-header' },
                        React.createElement('div', { className: 'quiz-title' }, 'Спасибо!'),
                        React.createElement('div', { className: 'quiz-subtitle' }, 'Заявка отправлена')
                    ),
                    
                    React.createElement('div', { className: 'price-display' },
                        React.createElement('div', { style: { fontSize: '64px' } }, '✅'),
                        React.createElement('div', { style: { marginTop: '16px', fontSize: '18px', fontWeight: '600' } },
                            'Менеджер свяжется с вами в течение 15 минут'
                        )
                    ),
                    
                    React.createElement('button', { 
                        className: 'button',
                        onClick: () => {
                            if (typeof vkBridge !== 'undefined') {
                                vkBridge.send('VKWebAppClose', { status: 'success' });
                            }
                        }
                    }, 'Закрыть')
                );
            }
            
            return React.createElement('div', { className: 'app-container' },
                React.createElement('div', { className: 'quiz-header' },
                    React.createElement('div', { className: 'quiz-title' },
                        furnitureType === 'kitchen' ? 'Расчет кухни' : 'Расчет шкафа'
                    )
                ),
                
                React.createElement('div', { className: 'price-display' },
                    React.createElement('div', { style: { color: '#666', fontSize: '14px' } },
                        'Примерная стоимость:'
                    ),
                    React.createElement('div', { className: 'price-value' },
                        quizData.priceMin?.toLocaleString() + ' - ' + quizData.priceMax?.toLocaleString() + ' ₽'
                    )
                ),
                
                !showForm ? 
                    React.createElement('button', { 
                        className: 'button',
                        onClick: () => setShowForm(true)
                    }, 'Получить точный расчет + Дизайн-проект бесплатно') :
                    React.createElement('div', null,
                        React.createElement('input', {
                            className: 'input-field',
                            type: 'text',
                            placeholder: 'Ваше имя',
                            value: name,
                            onChange: (e) => setName(e.target.value)
                        }),
                        
                        React.createElement('div', { style: { display: 'flex', gap: '8px' } },
                            React.createElement('input', {
                                className: 'input-field',
                                type: 'tel',
                                placeholder: '+7 (___) ___-__-__',
                                value: phone,
                                onChange: (e) => setPhone(e.target.value),
                                style: { flex: 1 }
                            }),
                            React.createElement('button', {
                                className: 'button',
                                style: { width: 'auto', padding: '14px', background: '#666', fontSize: '13px' },
                                onClick: handleGetPhone
                            }, 'Из VK')
                        ),
                        
                        React.createElement('button', {
                            className: 'button',
                            onClick: handleSubmit
                        }, 'Отправить заявку')
                    ),
                
                React.createElement('button', {
                    className: 'button button-back',
                    style: { marginTop: '12px' },
                    onClick: goBack
                }, 'Изменить параметры')
            );
        }
        
        // ==================== РЕНДЕРИНГ ====================
        console.log('Рендеринг приложения...');
        ReactDOM.render(
            React.createElement(App),
            document.getElementById('root')
        );
        console.log('Приложение отрендерено');
    </script>
</body>
</html>
